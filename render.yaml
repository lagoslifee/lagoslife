# Render Blueprint for the game server (Express + Colyseus), always on with its data in Neon (restore the latest backup there first, so every
# account, house and car carries over). Render dashboard > New > Blueprint > pick this repository.
# See docs/OPERATIONS.md#render-game-server.
services:
  - type: web
    name: lagos-living-server
    runtime: docker
    # Same region as the Neon database (us-east-2), since every save is a database round trip.
    # Free instances sleep after 15 idle minutes and take about a minute to wake, which players see as
    # "Connecting to Naija World". Starter stays up.
    plan: starter
    region: ohio
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    # Runs before each deploy goes live (already-applied migrations are skipped). The image's CMD starts the server.
    preDeployCommand: node dist/migrate.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the Neon connection string (Neon console > Connect) when Render asks for it.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://www.9jaworld.com
      # Password-reset email. Paste the Resend API key when Render asks for it, or leave it empty.
      - key: RESEND_API_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://www.9jaworld.com
      # Sign-up and sign-in are refused ("Invalid origin") from any site not listed here or in WEB_ORIGIN.
      - key: EXTRA_WEB_ORIGINS
        value: https://*.vercel.app,https://9jaworld.com,https://*.9jaworld.com,https://silver-elf-acde6c.netlify.app
      # Guest accounts are off: everyone plays with a signed-up account. Matches VITE_GUEST_MODE on Vercel.
      - key: GUEST_MODE
        value: "false"
