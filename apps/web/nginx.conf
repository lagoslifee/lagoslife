server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;

  include /etc/nginx/mime.types;
  types {
    model/gltf-binary glb;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Vite output: the file name changes whenever the content does.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Models, textures and world tiles keep stable names, so browsers revalidate them.
  location /assets/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}
