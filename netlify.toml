[build]
  command = "npm run build --prefix apps/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for client-side routes such as /moderation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite output: content-hashed file names, safe to cache forever.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
