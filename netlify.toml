# Netlify hosts only the web client. The game server (Express + Colyseus + PostgreSQL) needs a host that runs
# long-lived Node processes with WebSockets; set VITE_API_URL in the Netlify site's environment variables to its
# HTTPS origin before building. See docs/OPERATIONS.md#netlify-web-client.
[build]
  base = "."
  command = "npm run build -w @lagos-living/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Testing server: a Cloudflare quick tunnel to a server on the development VM. It changes whenever the tunnel
  # restarts and stops when the VM does; replace it with the real API origin for a lasting deployment.
  VITE_API_URL = "https://omaha-celebrate-promising-test.trycloudflare.com"
  # Testing only: visitors get a guest account instead of the sign-in page.
  VITE_GUEST_MODE = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
