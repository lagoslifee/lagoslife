services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lagos_living
      POSTGRES_USER: lagos
      POSTGRES_PASSWORD: lagos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagos -d lagos_living"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
